<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Offline — Tunez9ja</title>
<meta name="theme-color" content="#c8102e" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0f0f0f;
    color: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  .wrap {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .logo {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #c8102e;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    font-family: Georgia, serif;
    font-weight: 700; font-size: 22px; color: white;
  }
  h1 {
    font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2.25rem);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  p {
    color: #999;
    font-size: 15px;
    max-width: 26rem;
    line-height: 1.7;
    margin-bottom: 28px;
  }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
  button, a.btn {
    min-height: 44px;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    border: none;
    transition: transform 0.15s, opacity 0.15s;
  }
  button:active, a.btn:active { transform: scale(0.97); }
  .btn-primary { background: #c8102e; color: white; }
  .btn-secondary { background: transparent; color: #ccc; border: 1px solid #333; }
  .status {
    font-size: 12px;
    font-family: 'Courier New', monospace;
    color: #666;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #2a2a2a;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c8102e; }
  .dot.online { background: #22c55e; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .dot { animation: pulse 1.6s ease infinite; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">T9</div>
    <h1>You're offline</h1>
    <p id="msg">No internet connection right now. Your cached music is still available — head to your library to keep listening, or try reloading once you're back online.</p>
    <div class="actions">
      <button class="btn-primary" onclick="location.reload()">Try Again</button>
      <a class="btn btn-secondary" href="/">Go to Library</a>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Checking connection…</span>
    </div>
  </div>

  <script>
    function updateStatus() {
      const dot = document.getElementById('dot')
      const text = document.getElementById('statusText')
      const msg = document.getElementById('msg')
      if (navigator.onLine) {
        dot.classList.add('online')
        text.textContent = 'Back online — reload to continue'
        msg.textContent = 'Connection restored. Reload to pick up where you left off.'
      } else {
        dot.classList.remove('online')
        text.textContent = 'No connection'
      }
    }
    window.addEventListener('online', () => { updateStatus(); setTimeout(() => location.reload(), 800) })
    window.addEventListener('offline', updateStatus)
    updateStatus()
  </script>
</body>
</html>
