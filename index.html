<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tunez9ja — Nigeria's Premier Music Blog</title>
    <meta name="description" content="Tunez9ja Entertainment - Latest Nigerian music, afrobeats, news, and gossip. Est. 2021." />
    <meta name="theme-color" content="#c8102e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tunez9ja" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Tunez9ja — Nigeria's Premier Music Blog" />
    <meta property="og:description" content="Latest Nigerian music, afrobeats, news, and gossip. Est. 2021." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: preconnect + preload the stylesheet itself so the browser
         starts fetching font files in parallel with JS, instead of waiting
         for CSS to be discovered after the main bundle parses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Service worker registration now happens inside the React app
         (src/lib/swRegister.js, invoked from App.jsx) rather than here.
         This gives the app a single, safe, update-aware registration
         path instead of two independent ones that could race each
         other or double-register. -->
      <script src="https://js.paystack.co/v1/inline.js"></script>
  </body>
</html>
